controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - joint7